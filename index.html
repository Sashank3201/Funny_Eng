<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Portfolio</title>
    <meta name="description" content="Portfolio" />
  </head>
  <body>
    <!-- Poster gradient: the pre-first-frame state, and the no-WebGL fallback. -->
    <div class="poster" aria-hidden="true"></div>

    <!-- Fixed for the whole scroll. Purely decorative; every word is in the DOM. -->
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <!-- A soft, edgeless darkening under the content column. Not a panel: no
         border, no blur, no rectangle — just enough falloff to guarantee
         contrast where the camera choreography cannot. -->
    <div class="veil" aria-hidden="true"></div>

    <header class="chrome">
      <div class="chrome__left">
        <a class="chrome__mark" href="#hero" data-mark></a>
        <span class="status" data-status></span>
      </div>
      <nav class="chrome__nav" data-nav aria-label="Sections"></nav>
    </header>

    <!-- Live annotation of what the simulation is actually integrating. -->
    <aside class="readout" data-readout aria-hidden="true"></aside>

    <main id="content"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
