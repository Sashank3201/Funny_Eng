<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Portfolio</title>
    <meta name="description" content="Portfolio" />
  </head>
  <body>
    <!-- Poster gradient: the pre-first-frame state, and the no-WebGL fallback. -->
    <div class="poster" aria-hidden="true"></div>

    <!-- Fixed for the whole scroll. Purely decorative; every word is in the DOM. -->
    <canvas id="scene" class="scene" aria-hidden="true"></canvas>

    <!-- A soft, edgeless darkening under the content column. Not a panel: no
         border, no blur, no rectangle — just enough falloff to guarantee
         contrast where the camera choreography cannot. -->
    <div class="veil" aria-hidden="true"></div>

    <header class="chrome">
      <div class="chrome__left">
        <!-- The orbit glyph is the mark. Scrolling this page really is an orbit —
             3.5 radians of azimuth from the hero to the contact section — so the
             marker on this ring is the camera's actual position, not an
             ornament. The name only appears once the hero's own wordmark has
             scrolled away, so the two never sit on screen together. -->
        <a class="orbit" href="#hero" data-orbit></a>
        <span class="chrome__mark" data-mark></span>
        <span class="status" data-status></span>
      </div>
      <nav class="chrome__nav" data-nav aria-label="Sections"></nav>
      <button
        class="navtoggle"
        type="button"
        data-navtoggle
        aria-expanded="false"
        aria-controls="nav-sheet"
      >
        <span class="navtoggle__label">Menu</span>
      </button>
    </header>

    <!-- Narrow screens cannot hold the ring, three links and the availability
         line on one row, so the links move in here. A solid panel is the right
         answer for a temporary overlay in a way it never was for persistent
         chrome: it sidesteps the live render entirely. -->
    <div class="sheet" id="nav-sheet" data-sheet hidden>
      <nav class="sheet__nav" data-sheet-nav aria-label="Sections"></nav>
      <p class="sheet__status" data-sheet-status></p>
    </div>

    <!-- Live annotation of what the simulation is actually integrating. -->
    <aside class="readout" data-readout aria-hidden="true"></aside>

    <main id="content"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
